<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLMAgent — Chat Normal</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/logo.png?v=2">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/static/chat.css?v=1.0">
</head>
<body>
  <div class="chat-app">
    <!-- Sidebar de Historial -->
    <aside class="chat-sidebar" id="chat-sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <img src="/static/logo.png?v=1" alt="LLMAgent" class="brand-logo">
          <span>LLMAgent Chat</span>
        </div>
        <button class="btn-new-chat" id="btn-new-chat" type="button">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
          <span>Nuevo chat</span>
        </button>
        <div class="search-wrap">
          <input type="text" id="history-search" placeholder="Buscar en historial..." autocomplete="off">
        </div>
      </div>

      <div class="history-label">Historial</div>
      <div class="history-list" id="history-list"></div>

      <div class="sidebar-foot">
        <div class="model-pill" id="model-status-pill" title="Modelo activo en el servidor">
          <span class="dot" id="model-dot"></span>
          <span id="model-name-label">Conectando...</span>
        </div>
        <a href="/" class="btn-back-ide" title="Volver al IDE Crear Apps">
          <svg viewBox="0 0 24 24" class="ico"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m13 12-2 2 2 2"/><path d="m17 12 2 2-2 2"/></svg>
          <span>Abrir IDE</span>
        </a>
      </div>
    </aside>

    <!-- Área principal de conversación -->
    <main class="chat-main">
      <header class="chat-header">
        <div class="header-left">
          <button class="icon-btn" id="btn-toggle-sidebar" title="Mostrar u ocultar historial" aria-label="Mostrar u ocultar historial">
            <svg viewBox="0 0 24 24" class="ico"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
          </button>
          <h1 class="active-chat-title" id="active-chat-title">Nuevo chat</h1>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-header-new" title="Nuevo chat" aria-label="Nuevo chat">
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-btn" id="btn-clear-chat" title="Limpiar este chat" aria-label="Limpiar este chat">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="m6 7 1 13h10l1-13"/></svg>
          </button>
        </div>
      </header>

      <div class="messages-scroll" id="messages-scroll">
        <div class="messages-inner" id="messages-container"></div>
      </div>

      <div class="composer-area">
        <div class="composer-wrap">
          <div class="img-preview hidden" id="image-preview-box">
            <img id="image-preview-img" alt="Imagen adjunta" src="">
            <button class="img-cancel" id="btn-cancel-image" title="Quitar imagen">&times;</button>
          </div>
          <input type="file" id="image-input" accept="image/*" hidden>

          <div class="composer-box">
            <textarea id="chat-textarea" rows="1" placeholder="Escribe un mensaje... (Enter para enviar, Shift+Enter para salto)"></textarea>
            <div class="composer-foot">
              <div class="cf-left">
                <button class="icon-btn" id="btn-upload-image" title="Adjuntar imagen (o pega con Ctrl+V)" aria-label="Adjuntar imagen">
                  <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
                </button>
                <button class="pill-toggle" id="btn-toggle-web" title="Búsqueda web en vivo">
                  <span>Web ON</span>
                </button>
                <button class="pill-toggle off" id="btn-toggle-anon" title="Modo Anónimo (Tor / Proxy)">
                  <span>Anon OFF</span>
                </button>
                <button class="pill-toggle off" id="btn-toggle-cloud" title="Trabajadores Nube">
                  <span>Cloud OFF</span>
                </button>
              </div>
              <div class="cf-right">
                <button class="stop-btn hidden" id="btn-stop" title="Detener generación" aria-label="Detener generación">
                  <svg viewBox="0 0 24 24" class="ico"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
                <button class="send-btn" id="btn-send" title="Enviar" aria-label="Enviar mensaje">
                  <svg viewBox="0 0 24 24" class="ico"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/chat.js?v=1.0"></script>
</body>
</html>
